[package]
name = "network-daemon"
version = "0.1.0"
edition = "2024"

[dependencies]
thiserror = "2"

# Async trait support
libc = "0.2.178"
libnetwork-daemon = { version = "0.1.0", path = "../libnetwork-daemon" }
tracing = "0.1.44"
tracing-subscriber = "0.3.22"
netlink-packet-route = { path = "../../netlink-packet-route" }
netlink-packet-core = "0.8.1"
nix = { version = "0.30.1", features = ["fs", "user"] }
serde_json = "1.0.148"
kameo = "0.19.2"
async-io = "2.6.0"
futures-lite = "2.6.1"
async-channel = "2.5.0"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "time", "fs", "process", "signal"] }
tokio-util = { version = "0.7.17", features = ["rt"] }
tokio-stream = "0.1.17"
futures-util = "0.3.31"
serde = "1.0.228"
async-net = "2.0.0"
route_manager = { path = "../vendor/route_manager", features = ["async_io"] }
dhcproto = "0.14.0"
etherparse = "0.19.0"
rand = "0.9.2"
pcap = "2.4.0"
rusqlite = { version = "0.32", features = ["bundled"] }
toml = "0.8"
aes-gcm = "0.10"
zeroize = "1.8"

[build-dependencies]
bindgen = "0.71"

[features]
default = []

[dev-dependencies]
tokio-test = "0.4"
