[package]
name = "libnetwork-daemon"
version = "0.1.0"
edition = "2024"

[dependencies]
async-channel = "2.5.0"
crossbeam-queue = "0.3.12"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.148"
thiserror = "2.0.17"
unicode-width = "0.2"
schemars = "1.2.0"
netlink-packet-core = "0.8.1"
kameo = "0.19.2"
futures-util = "0.3.31"
bitflags = "2.10.0"
tokio = { version = "1.49.0", default-features = false }

[dev-dependencies]
futures-lite = "2.6.1"
